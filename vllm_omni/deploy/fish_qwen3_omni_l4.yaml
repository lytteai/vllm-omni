# Fish Speech S2 Pro — single NVIDIA L4 24GB, low-latency phone TTS.
#
# Why this is not the default fish_qwen3_omni.yaml:
#   * Default max_model_len=16384 over-allocates KV on 24GB (Stage0 ~20GB).
#   * Default connector_get_sleep_s=10ms adds up to 10ms to every DAC chunk.
#   * Default initial_codec_chunk_frames=4 is too small for DAC (warbly start)
#     and, without single_initial_chunk, re-decodes 4/8/12/… overlapping windows.
#   * Default max_num_seqs=4 wastes CUDA-graph / KV budget on a 1-call bot.
#
# Slow AR decode is not chunked-prefill-safe — keep enable_chunked_prefill false
# and max_num_batched_tokens >= max_model_len.
#
#   vllm serve fishaudio/s2-pro --omni --port 8000 \
#       --deploy-config vllm_omni/deploy/fish_qwen3_omni_l4.yaml

async_chunk: true
enable_chunked_prefill: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      fish_speech_tensor_codes: true
      fish_speech_single_initial_chunk: true
      # 4 frames * 2048 hop / 44100 ≈ 186 ms of audio before first DAC emit.
      # Matches the ~750 ms TTFA we measured on L4 with CUDA graphs.
      # Raise to 8 if the first syllable warbles; 12 costs ~700 ms extra TTFA.
      codec_chunk_frames: 25
      codec_left_context_frames: 25
      initial_codec_chunk_frames: 4
      fish_speech_dac_dtype: fp16

stages:
  - stage_id: 0
    max_num_seqs: 2
    gpu_memory_utilization: 0.78
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_k: 30
      top_p: 0.9
      max_tokens: 768
      seed: 42
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 2
    gpu_memory_utilization: 0.12
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0
