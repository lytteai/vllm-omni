# Fish Speech S2 Pro — single NVIDIA L4 24GB, low-latency phone TTS.
#
# Tuned for one in-flight call: FULL decode CUDA graphs at batch=1.
# Fast AR residual codes stay greedy so the runner can wrap talker_mtp;
# Slow AR semantic tokens stay sampled (temperature 0.8) for natural speech.
# Do not capture a custom Fast AR CUDA graph — static-KV SDPA / graph replay
# corrupts residual codes and the voice stops sounding human.
#
# First DAC window is 4 frames (~186 ms audio, ~370 ms wall). No HTTP preroll —
# holding 1–2 s of PCM at 0.55x RTF made first-byte 3–4 s. Target HTTP TTFT
# <800 ms. GPU ~95% during decode is expected.
# Clients: stream=true, stream_format="audio", PLAYBACK_PREROLL_MS=0.
#
# Why fp8 is not optional here. One Slow AR step runs the 36-layer backbone
# plus ten Fast AR passes over its four layers (one per codebook), which reads
# ~16 GB of bf16 weights, and it buys exactly one 2048-sample DAC frame =
# 46.4 ms of audio. An L4 peaks at 300 GB/s, so bf16 tops out near 54 ms/step
# even at 100% bandwidth efficiency; measured is ~78 ms, i.e. 0.6x realtime,
# and a phone call cannot be fed below 1.0x. fp8 halves the linear weights to
# ~8.5 GB/step, which is what puts this profile over realtime. Sub-realtime is
# not a tuning problem: no chunk size or preroll setting can fix it.
# If residual codes sound rough, isolate it with
# VLLM_OMNI_FISH_QUANT_FAST_AR=0 (keeps the backbone in fp8) before dropping
# quantization entirely.
#
# Slow AR decode is not chunked-prefill-safe — keep enable_chunked_prefill false
# and max_num_batched_tokens >= max_model_len.
#
#   unset VLLM_OMNI_FISH_KVCACHE_ATTN
#   unset VLLM_OMNI_SPEECH_STREAM_PREROLL_MS
#   vllm serve fishaudio/s2-pro --omni --port 8000 \
#       --deploy-config vllm_omni/deploy/fish_qwen3_omni_l4.yaml

async_chunk: true
enable_chunked_prefill: false
# Weights are quantized on load from the bf16 checkpoint; no calibration step.
quantization: fp8

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      # 4 Slow AR steps * ~76 ms ≈ 304 ms; 300 was too tight when ITL spikes.
      connector_get_max_wait: 2000
      fish_speech_tensor_codes: true
      fish_speech_single_initial_chunk: true
      codec_chunk_frames: 4
      codec_left_context_frames: 25
      initial_codec_chunk_frames: 4
      # Stage 1 shares the GPU with Slow AR decode, so keep DAC off fp32.
      fish_speech_dac_dtype: fp16
      speech_stream_preroll_auto: false
      speech_stream_preroll_ms: 0
      # Even if env/auto preroll is set, never hold past ~700 ms wall.
      speech_stream_max_first_chunk_ms: 700
      speech_stream_gen_rtf: 0.62

stages:
  - stage_id: 0
    max_num_seqs: 1
    gpu_memory_utilization: 0.78
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    compilation_config:
      cudagraph_mode: FULL_DECODE_ONLY
      cudagraph_capture_sizes: [1]
      cudagraph_num_of_warmups: 1
    # Fast AR residual codes: argmax is graph-safe and skips 9 multinomials
    # per Slow AR step. Slow AR semantic sampling stays at temperature 0.8.
    subtalker_sampling_params:
      do_sample: false
      temperature: 0.0
      top_k: 1
      top_p: 1.0
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.8
      top_k: 30
      top_p: 0.9
      max_tokens: 768
      seed: 42
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 1
    gpu_memory_utilization: 0.12
    enforce_eager: true
    # The DAC is convolutional and built outside vLLM's linear layers, so the
    # pipeline-wide fp8 setting would buy nothing here; fish_speech_dac_dtype
    # is what controls its precision.
    quantization: null
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 4096
    max_model_len: 4096
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      seed: 42
      repetition_penalty: 1.0
